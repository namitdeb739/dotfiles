# btop — resource monitor, replacing htop.
#
# Theme matches ghostty, nvim, tmux and VS Code. btop cannot follow the macOS
# appearance setting, so this is pinned to Mocha like tmux and lazygit.
color_theme = "catppuccin_mocha"
theme_background = False
truecolor = True
vim_keys = True
rounded_corners = True
proc_sorting = "cpu lazy"
proc_tree = False
proc_gradient = True
show_battery = True
update_ms = 1500

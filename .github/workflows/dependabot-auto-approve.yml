name: Auto-merge Dependabot PRs

# `pull_request_target` rather than `pull_request`: Dependabot PRs run with a
# read-only GITHUB_TOKEN under `pull_request`, so `gh pr merge` could never
# work there regardless of the permissions block below. `pull_request_target`
# runs in the context of the base branch with a writable token.
#
# The usual danger of `pull_request_target` is executing untrusted PR code with
# elevated permissions. This workflow never checks the PR out and runs only
# `gh` against the API, so there is no untrusted code path. The actor guard
# below further restricts it to Dependabot.
on: pull_request_target

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        runs-on: ubuntu-latest
        if: github.actor == 'dependabot[bot]'
        steps:
            # There is deliberately no approval step. `main` has no
            # required-review rule, so approval buys nothing, and GitHub blocks
            # Actions from approving PRs by default ("GitHub Actions is not
            # permitted to approve pull requests") — which failed this workflow
            # on every Dependabot PR.

            # `main` also has no required status checks, so `gh pr merge --auto`
            # would merge as soon as the PR is mergeable, without waiting for
            # CI. Wait for the checks explicitly instead. Branch protection is
            # deliberately left off so direct pushes to main keep working.
            #
            # PR_NUMBER reaches the shell only as an env var, never as a
            # ${{ }} interpolation inside `run:` — see the repo security hook.
            - name: Wait for CI
              run: gh pr checks "$PR_NUMBER" --watch --fail-fast --interval 30
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}

            - name: Merge
              run: gh pr merge --squash --delete-branch "$PR_NUMBER"
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}

# tmux — session persistence, which Ghostty deliberately does not provide.
#
# Deliberately plugin-free: no TPM, nothing to bootstrap or update. Catppuccin
# colours are inlined below rather than pulled from a theme plugin.

# --- Terminal ---------------------------------------------------------------
# Ghostty advertises xterm-ghostty and supports true colour; tmux needs telling.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"
# Let programs set the clipboard through tmux via OSC 52 (nvim uses
# clipboard=unnamedplus, and Ghostty has clipboard-write = allow).
set -g set-clipboard on
# Ghostty's own titles are more useful than tmux's.
set -g set-titles off

# --- Behaviour --------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g escape-time 0          # no delay on ESC, which nvim needs
set -g focus-events on        # lets nvim autoread work
set -g base-index 1           # windows start at 1, matching the number row
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000

# --- Prefix -----------------------------------------------------------------
# C-b collides with vim's page-up. C-a is the common alternative.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Splits -----------------------------------------------------------------
# Match nvim's splitright/splitbelow and Ghostty's cmd+d / cmd+shift+d.
# Panes open in the current directory rather than $HOME.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# --- Navigation -------------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload without restarting.
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# --- Copy mode --------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- Appearance (Catppuccin Mocha) ------------------------------------------
# tmux cannot follow the system appearance, so this is fixed, same trade-off
# as lazygit. Palette matches ghostty/.config/ghostty/config.
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]"
set -g status-right "#[fg=#585b70]#{?client_prefix,#[fg=#f38ba8]PREFIX ,}#[fg=#a6adc8]%a %d %b #[fg=#89b4fa,bold]%H:%M "
setw -g window-status-format "#[fg=#a6adc8] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
